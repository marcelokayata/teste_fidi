services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DB_PATH: /data/banco.db
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - sqlite_data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  sqlite_data:
    driver: local